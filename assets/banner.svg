<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .pulsing-orb {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-1 {
      animation: floatOrb1 8s ease-in-out infinite;
    }
    .floating-2 {
      animation: floatOrb2 9s ease-in-out infinite;
    }
    .scanner {
      animation: scanLine 5s linear infinite;
    }
    .dash-stream {
      stroke-dasharray: 6, 6;
      animation: dashMove 2.5s linear infinite;
    }
    .radar {
      transform-origin: 1040px 140px;
      animation: radarSweep 10s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Glowing Orbs (Strictly in Background) -->
  <g class="floating-1">
    <circle cx="180" cy="100" r="140" fill="#00f2fe" opacity="0.12" filter="url(#softGlow)" />
  </g>
  <g class="floating-2">
    <circle cx="1020" cy="140" r="160" fill="#7928ca" opacity="0.15" filter="url(#softGlow)" />
    <circle cx="600" cy="380" r="120" fill="#10b981" opacity="0.08" filter="url(#softGlow)" />
  </g>

  <!-- Grid overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Background Animated Cyber Radar Effect (Right Side) -->
  <g opacity="0.4">
    <circle cx="1040" cy="140" r="110" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4, 4" />
    <circle cx="1040" cy="140" r="75" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="1040" cy="140" r="40" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.5" />
    <line x1="930" y1="140" x2="1150" y2="140" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.3" />
    <line x1="1040" y1="30" x2="1040" y2="250" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.3" />
    <line class="radar" x1="1040" y1="140" x2="1140" y2="140" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" opacity="0.7" />
  </g>

  <!-- Subtle Data Stream Lines (Left Side & Bottom) -->
  <g opacity="0.45">
    <path class="dash-stream" d="M 80 40 L 80 180 Q 80 220 120 220 L 320 220" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <path class="dash-stream" d="M 860 360 L 1020 360 Q 1060 360 1060 320 L 1060 260" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Subtle Laser Scan Line (Faint, behind foreground) -->
  <g class="scanner">
    <line x1="40" y1="20" x2="1160" y2="20" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.5" filter="url(#glow)" />
  </g>

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Pill / Badge -->
  <g transform="translate(80, 52)">
    <rect width="275" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#10b981" filter="url(#glow)" />
    <text x="32" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5">DATA SECURITY POSTURE MANAGEMENT</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Awesome DSPM</text>

  <!-- Subtitle -->
  <text x="80" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.2">The Definitive Guide &amp; Catalog to Cloud Data Security &amp; Discovery</text>

  <!-- Tagline / Description -->
  <text x="80" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Curated SaaS Platforms, Open-Source Scanners, PII Discovery Engines, Access Governance &amp; Market Intelligence
  </text>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(80, 275)">
    <!-- Pill 1: Sensitive Data Discovery -->
    <g transform="translate(0, 0)">
      <rect width="195" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#38bdf8" />
      <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Sensitive Data Discovery</text>
    </g>

    <!-- Pill 2: Access & Exposure Analysis -->
    <g transform="translate(210, 0)">
      <rect width="195" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#a855f7" />
      <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Access &amp; Risk Graph</text>
    </g>

    <!-- Pill 3: Open-Source Scanners -->
    <g transform="translate(420, 0)">
      <rect width="180" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Open-Source Scanners</text>
    </g>

    <!-- Pill 4: Enterprise SaaS Benchmark -->
    <g transform="translate(615, 0)">
      <rect width="205" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#f59e0b" />
      <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">SaaS Pricing &amp; Valuation</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="414" width="1200" height="6" fill="url(#cyanGrad)" />
</svg>
